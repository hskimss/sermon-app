<template id="sermon-chapter-3-template">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:ital@0;1&family=Noto+Sans+KR:wght@400;500&display=block" rel="stylesheet" />

  <div
    data-composition-id="sermon-chapter-3"
    data-start="0"
    data-duration="40"
    data-width="1080"
    data-height="1920"
  >
    <div class="stage-05">
      <div class="grid-floor"></div>

      <div class="surface s-plan">
        <div class="headline h-plan">{{CH3_SCENE_1}}</div>
        <div class="panel-block">
          <div class="panel-inner"></div>
        </div>
      </div>

      <div class="surface s-build">
        <div class="headline h-build">{{CH3_SCENE_2}}</div>
        <div class="panel-block">
          <div class="panel-inner"></div>
        </div>
        <div class="micro-cap">{{CH3_CAPTION}}</div>
      </div>

      <div class="surface s-monitor">
        <div class="headline h-monitor">{{CH3_SCENE_3}}</div>
        <div class="panel-block">
          <div class="panel-inner"></div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="sermon-chapter-3"] {
        position: absolute; inset: 0; overflow: hidden; background: #000;
      }
      [data-composition-id="sermon-chapter-3"] .stage-05 { position: absolute; inset: 0; }
      [data-composition-id="sermon-chapter-3"] .grid-floor {
        position: absolute; inset: 0;
        transform: perspective(900px) rotateX(60deg) translateY(25%);
        background:
          repeating-linear-gradient(0deg,  rgba(255,255,255,0.04) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 80px);
        background-color: #000;
      }
      [data-composition-id="sermon-chapter-3"] .surface {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        opacity: 0;
        will-change: opacity, transform;
      }
      [data-composition-id="sermon-chapter-3"] .headline {
        font-family: "Noto Serif KR", serif;
        font-style: italic;
        font-size: 100px;
        line-height: 1.2;
        background: linear-gradient(180deg, #E8C876 0%, #B8923A 60%, #7A5A1E 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 40px rgba(184,146,58,0.25);
        word-break: keep-all;
        text-align: center;
        max-width: 900px;
      }
      [data-composition-id="sermon-chapter-3"] .panel-block {
        position: relative;
        width: 900px; height: 500px;
        border-radius: 24px;
        border: 2px solid rgba(184,146,58,0.2);
        box-shadow:
          0 40px 80px rgba(0,0,0,0.8),
          inset 0 1px 0 rgba(255,255,255,0.1),
          0 0 60px rgba(184,146,58,0.1);
        overflow: hidden;
      }
      [data-composition-id="sermon-chapter-3"] .panel-inner {
        width: 100%; height: 100%;
        background: linear-gradient(135deg, #0D1117 0%, #1A1F2E 50%, #0A0D14 100%);
      }
      [data-composition-id="sermon-chapter-3"] .micro-cap {
        position: absolute;
        bottom: 120px; left: 50%;
        transform: translateX(-50%);
        font-family: "Noto Sans KR", sans-serif;
        font-size: 28px;
        font-weight: 500;
        color: rgba(255,255,255,0.85);
        letter-spacing: 0.01em;
        padding: 10px 20px;
        border-radius: 10px;
        background: rgba(10,8,5,0.55);
        backdrop-filter: blur(8px);
        opacity: 0;
        white-space: nowrap;
        word-break: keep-all;
      }
      [data-composition-id="sermon-chapter-3"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.95) 95%);
        opacity: 0.7;
      }
      [data-composition-id="sermon-chapter-3"] .grain {
        position: absolute; inset: 0; pointer-events: none;
        opacity: 0.08;
        background-image:
          radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
      }
    </style>

    <script>
      (() => {
        const SLOT = 40;
        const tl = gsap.timeline({ paused: true });
        const sel = (q) => `[data-composition-id="sermon-chapter-3"] ${q}`;

        gsap.set(sel('.s-plan'), { y: '100%', opacity: 0 });
        tl.to(sel('.s-plan'), { y: '0%', opacity: 1, duration: 0.7, ease: 'power3.out' }, 0);
        tl.to(sel('.s-plan'), { x: '-40%', opacity: 0, filter: 'blur(20px)', duration: 0.4, ease: 'power2.in' }, 1.5);

        gsap.set(sel('.s-build'), { x: '40%', opacity: 0, filter: 'blur(25px)' });
        tl.to(sel('.s-build'),
          { x: '0%', opacity: 1, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, 1.5);

        tl.to(sel('.micro-cap'), { opacity: 1, duration: 0.4, ease: 'power2.out' }, 2.0);
        tl.to(sel('.micro-cap'), { opacity: 0, duration: 0.3, ease: 'power2.in' }, 3.0);

        tl.to(sel('.s-build'),
          { y: '-30%', opacity: 0, filter: 'blur(20px)', duration: 0.4, ease: 'power2.in' }, 3.0);

        gsap.set(sel('.s-monitor'), { y: '100%', opacity: 0 });
        tl.to(sel('.s-monitor'), { y: '0%', opacity: 1, duration: 0.7, ease: 'power3.out' }, 3.0);

        tl.to(sel('.s-monitor'),
          { scale: 0.8, opacity: 0, filter: 'blur(20px)', duration: 0.35, ease: 'power2.in' }, 4.35);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['sermon-chapter-3'] = tl;
      })();
    </script>
  </div>
</template>
