<template id="scene-hook-template">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <div data-composition-id="scene-hook" data-start="0" data-duration="6" data-width="1080" data-height="1920">
  <style>
    [data-composition-id="scene-hook"] {
      width: 1080px; height: 1920px;
      background: #0E1116;
      position: relative;
      overflow: hidden;
      font-family: 'Pretendard Variable', sans-serif;
    }
    /* SKILL.md: scene-content fills via flex + padding (NEVER position:absolute) */
    [data-composition-id="scene-hook"] .scene-content {
      width: 100%; height: 100%;
      padding: 320px 80px 320px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    [data-composition-id="scene-hook"] .hook-text {
      font-family: 'Pretendard Variable', sans-serif;
      font-weight: 800;
      font-size: 84px;
      line-height: 1.18;
      text-align: center;
      color: #F5EFE0;
      word-break: keep-all;
      letter-spacing: -0.01em;
      max-width: 920px;
    }
  </style>

  <div class="scene-content">
    <div class="hook-text" id="hook-headline">{{HOOK_TEXT}}</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
window.__timelines = window.__timelines || {};
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Entrance only (SKILL.md: sub-comp prefer gsap.fromTo)
      tl.fromTo("#hook-headline",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.3);
      // NO exit — root composition's transition handles the exit
      tl.set({}, {}, 6);
      window.__timelines["scene-hook"] = tl;
    })();
  
  </script>
</div>
</template>
